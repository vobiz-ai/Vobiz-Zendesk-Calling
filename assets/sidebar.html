<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vobiz Calling</title>
    <script src="https://assets.zendesk.com/apps/sdk/2.0/zaf_sdk.js"></script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        color: #49545c;
        background: transparent;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e83c00;
        flex: none;
      }
      .hint { line-height: 1.45; }
      .stack { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; }
      .who { font-weight: 600; color: #2f3941; }
      .call-btn {
        align-self: flex-start;
        border: 1px solid #e83c00;
        background: #e83c00;
        color: #fff;
        border-radius: 4px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .call-btn:disabled { opacity: .45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <!--
      This instance exists so the app can resolve which ticket the agent is
      looking at. ZAF exposes `ticket.id` only to an instance that is actually
      in ticket context; the top-bar softphone has none, so without this the
      call log could never attach to the open ticket and every call created a
      brand new one instead.

      It renders a single line of text on purpose - the softphone itself lives
      in the top bar.
    -->
    <div class="row">
      <span class="dot"></span>
      <span class="hint">Vobiz calls on this ticket are logged here automatically.</span>
    </div>
    <!--
      The one thing worth more than a line of text here: a Call button.
      Zendesk's own click-to-dial event (voice.dialout, relayed by
      background.js) only fires on Talk Partner Edition. This path works on
      every plan, and hands the number to the same top-bar entry point.
    -->
    <div class="stack">
      <span id="sidebar-requester" class="who">Loading requester…</span>
      <button id="sidebar-call-btn" class="call-btn" disabled>Call requester</button>
      <span id="sidebar-hint" class="hint"></span>
    </div>
    <script src="scripts/sidebar.js"></script>
  </body>
</html>
