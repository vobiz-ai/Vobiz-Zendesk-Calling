<!--
  Top bar icon: the Vobiz mark, monochrome.

  The filename is load-bearing: Zendesk reads assets/icon_top_bar.svg for a
  top_bar app and nothing else. Zendesk scales it to 18x18 inside a 30x30
  rounded box and tints it for the bar's state, so it is a single colour
  (currentColor), no gradients or shadows, on a square viewBox.

  Geometry is the Vobiz mark (42x30, see tools/make-brand-assets.py), centred
  on a 48x48 square with a little padding:
    ring sector  centre (42,30), outer r 30, inner r 15, upper-left quadrant
    sector       centre (0,15),  r 15,                   upper-right quadrant
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -9 48 48" width="18" height="18">
  <path fill="currentColor" d="M12 30A30 30 0 0 1 42 0V15A15 15 0 0 0 27 30Z"/>
  <path fill="currentColor" d="M0 15V0A15 15 0 0 1 15 15Z"/>
</svg>
